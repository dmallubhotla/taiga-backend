name: ci
on:
  push:
    branches: ['**']
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hanko computes its version from git history (branch, tags, sha),
          # so we need the full history available locally.
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: Flake check (formatting, lint, tests)
        run: nix flake check --print-build-logs
      - name: Build taiga binary
        run: nix build --print-build-logs .#default
      - name: Build docker image
        run: nix build --print-build-logs .#docker-image -o result-docker
      - name: Publish image to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${OWNER,,}/taiga"
          echo "$GHCR_TOKEN" | nix run nixpkgs#skopeo -- login ghcr.io \
            --username "$GHCR_USER" --password-stdin
          nix develop --command hanko version docker tags --latest-on-release-tag "$IMAGE" \
          | while IFS= read -r tag; do
              [[ -z "$tag" ]] && continue
              echo "::group::skopeo copy → $tag"
              nix run nixpkgs#skopeo -- copy --insecure-policy \
                "docker-archive:./result-docker" \
                "docker://$tag"
              echo "::endgroup::"
            done
