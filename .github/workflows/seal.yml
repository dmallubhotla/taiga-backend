name: seal
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Walk the seal pipeline without mutating anything."
        type: boolean
        default: false
      bump:
        description: "Force a bump direction (patch/minor/major/none). Blank uses the configured strategy."
        type: string
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: seal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  seal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: Configure git identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name  "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
      - name: Seal
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ -n "$BUMP" ]]; then args+=(--bump "$BUMP"); fi
          nix develop --command hanko seal "${args[@]}"
