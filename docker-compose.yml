version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trygo-postgres
    environment:
      POSTGRES_USER: trygo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trygo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trygo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Run the application in Docker
  # app:
  #   build: .
  #   container_name: trygo-app
  #   environment:
  #     - TRYGO_DB_DRIVER=postgres
  #     - TRYGO_DB_HOST=postgres
