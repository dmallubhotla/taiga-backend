  #     - TRYGO_DB_USER=trygo
  #     - TRYGO_DB_PASSWORD=password
  #     - TRYGO_DB_NAME=trygo_db
  #     - TRYGO_PORT=8080
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  postgres_data: