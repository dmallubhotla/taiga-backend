# git-cliff config; `hanko seal` regenerates CHANGELOG.md with it (see .hanko.yaml).
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to taiga-backend. Generated by git-cliff from conventional commits.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
# Commits from before the switch to conventional commits land under "Other" rather than vanishing.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "oldest"
tag_pattern = "v[0-9]*"
commit_preprocessors = [
  # Legacy docs prefixes, so pre-convention roadmap and doc commits group as docs.
  { pattern = '^(?i)(roadmap|docs|claude\.md):\s*', replace = "docs: " },
]
# Group names carry an HTML-comment sort key; the body template strips it.
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^chore: [Rr]elease", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(build|deps)", group = "<!-- 6 -->Build" },
  { message = "^ci", group = "<!-- 7 -->CI" },
  { message = "^(chore|style)", group = "<!-- 8 -->Chores" },
  { message = ".*", group = "<!-- 9 -->Other" },
]
